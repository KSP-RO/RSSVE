name: Build Release Packages

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage packages
        run: |
          set -euo pipefail

          mkdir -p staging_hr/RSSVE staging_lr/RSSVE

          # Copy everything except MainTextures (handled separately) and dev artifacts
          rsync -a \
            --exclude='Textures/MainTextures' \
            RSSVE/ staging_hr/RSSVE/
          rsync -a \
            --exclude='Textures/MainTextures' \
            RSSVE/ staging_lr/RSSVE/

          mkdir -p staging_hr/RSSVE/Textures/MainTextures
          mkdir -p staging_lr/RSSVE/Textures/MainTextures

          src=RSSVE/Textures/MainTextures

          # Texture set names, with any _HR/_LR suffix stripped
          names=$(for dir in "$src"/*/; do
                    name=$(basename "$dir")
                    name="${name%_HR}"
                    echo "${name%_LR}"
                  done | sort -u)

          # Each package prefers its own resolution, falls back to the other one,
          # then to an unsuffixed (shared) folder
          while IFS= read -r name; do
            for pkg in hr lr; do
              if [ "$pkg" = hr ]; then
                preferred="${name}_HR"; fallback="${name}_LR"
              else
                preferred="${name}_LR"; fallback="${name}_HR"
              fi

              if [ -d "$src/$preferred" ]; then
                chosen="$preferred"
              elif [ -d "$src/$fallback" ]; then
                chosen="$fallback"
              elif [ -d "$src/$name" ]; then
                chosen="$name"
              else
                echo "::error::No texture folder found for $name"
                exit 1
              fi

              cp -r "$src/$chosen" "staging_$pkg/RSSVE/Textures/MainTextures/$name"
              echo "${pkg^^}: $name <- $chosen"
            done
          done <<< "$names"

      - name: Verify staged textures
        run: |
          set -euo pipefail
          for pkg in hr lr; do
            echo "== ${pkg^^} =="
            for dir in staging_$pkg/RSSVE/Textures/MainTextures/*/; do
              count=$(find "$dir" -type f | wc -l)
              echo "  $(basename "$dir"): $count file(s)"
              [ "$count" -gt 0 ] || { echo "::error::$dir is empty"; exit 1; }
            done
          done

      - name: Upload HR artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSSVE_HR
          path: staging_hr/

      - name: Upload LR artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSSVE_LR
          path: staging_lr/
