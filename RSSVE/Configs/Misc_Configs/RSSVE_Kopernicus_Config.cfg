//  ================================================================================
//  RSSVE Kopernicus patches:
//
//  • Change the Sun flare and light colors to be clear white (6000 K).
//  • Remove the default yellow Sun corona.
//  • Modify the ambient and the sunlight colors of the atmospheres.
//  • Fix the atmosphere fading effects.
//  • Add a custom ring texture to Saturn.
//  • Remove the oblateness of the gas giants since it breaks the EVE effects.
//  ================================================================================

@Kopernicus:FOR[RSSVE]:NEEDS[RealSolarSystem]
{
    @Body[Sun]
    {
        @ScaledVersion
        {
            @Light
            {
                %sunlightColor = RGBA(255, 255, 255, 255)
                %sunlightIntensity = 0.9
                %sunlightShadowStrength = 0.9
                %scaledSunlightColor = RGBA(255, 255, 255, 255)
                %scaledSunlightIntensity = 0.9
                %IVASunColor = RGBA(255, 255, 255, 255)
                %IVASunIntensity = 0.9
                %ambientLightColor = RGBA(15, 15, 15, 255)
                %sunLensFlareColor = RGBA(0, 0, 0, 0)
                %sunAU = 149597870700
            }

            %Coronas
            {
                %Corona
                {
                    %Material
                    {
                        %texture = RSSVE/Textures/MainTextures/Misc/Empty
                    }
                }
            }

            %Material
            {
                %emitColor0 = RGBA(0, 0, 0, 255)
                %emitColor1 = RGBA(128, 128, 128, 255)
                %rimColor = RGBA(255, 255, 255, 255)
                %rimBlend = 2.5
                %rimPower = 0.0
                %sunspotColor = RGBA(255, 255, 255, 255)
                %sunspotPower = 1.5
            }
        }
    }

    @Body[Venus]
    {
        @Atmosphere
        {
            %ambientColor = 0.078, 0.074, 0.071, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %innerRadius = 6030000
                %outerRadius = 6178000
                %waveLength = 0.49, 0.50, 0.53, 1.0
            }
        }
    }

    @Body[Kerbin]
    {
        @Atmosphere
        {
            %ambientColor = 0.003, 0.014, 0.05, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %innerRadius = 6351000
                %outerRadius = 6511000
                %waveLength = 0.65, 0.58, 0.50, 1.0
            }
        }
    }

    @Body[Mars]
    {
        @ScaledVersion
        {
            @rimBlend = 1.0
            @rimPower = 3.0
        }

        @Atmosphere
        {
            %ambientColor = 0.067, 0.039, 0.023, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %innerRadius = 3355800
                %outerRadius = 3465000
                %waveLength = 0.55, 0.60, 0.65, 1.0
            }
        }
    }

    @Body[Jupiter]
    {
        @Atmosphere
        {
            @ambientColor = 0.094, 0.094, 0.098, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                @outerRadius = 71107325
                @waveLength = 0.94, 0.94, 0.98, 0.5
            }
        }
    }

    @Body[Saturn]
    {
        @Atmosphere
        {
            %ambientColor = 0.01, 0.01, 0.01, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %waveLength = 0.1, 0.1, 0.1, 0.5
            }
        }

        @Rings
        {
            @Ring
            {
                @texture = RSSVE/Textures/MainTextures/Misc/SaturnRings
                @innerRadius = 1250
                @outerRadius = 2500
                @color = RGBA(220, 220, 220, 255)
                %unlit = False
                %useNewShader = True
                %penumbraMultiplier = 1000
				%steps = 512
            }
        }
    }

    @Body[Titan]
    {
        @Atmosphere
        {
            %ambientColor = 0.08, 0.02, 0.0, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %innerRadius = 2575000
                %outerRadius = 2630000
                %waveLength = 0.73, 0.76, 0.83, 1.0
            }
        }
    }

    @Body[Uranus]
    {

        @Atmosphere
        {
            %ambientColor = 0.06, 0.074, 0.078, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %outerRadius = 25319550
                %waveLength = 0.60, 0.74, 0.78, 0.5
            }
        }
    }

    @Body[Neptune]
    {
        @Atmosphere
        {
            %ambientColor = 0.027, 0.043, 0.098, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %outerRadius = 24687125
                %waveLength = 0.27, 0.43, 0.98, 0.5
            }
        }
    }

    @Body[Triton]
    {
        @Atmosphere
        {
            %ambientColor = 0.01, 0.01, 0.01, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %outerRadius = 1387235
                %waveLength = 0.1, 0.1, 0.1, 0.5
            }
        }
    }

    @Body[Pluto]
    {
        @Atmosphere
        {
            %ambientColor = 0.006, 0.007, 0.009, 1.0
            !lightColor = DELETE

            &AtmosphereFromGround
            {
                %outerRadius = 1216675
                %waveLength = 0.06, 0.07, 0.01, 0.5
            }
        }
    }
}
