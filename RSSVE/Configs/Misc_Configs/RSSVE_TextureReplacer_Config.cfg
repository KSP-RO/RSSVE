//  ================================================================================
//  Texture Replacer patches:
//
//  Add a custom skymap texture with corrected Milky Way inclination.
//  ================================================================================

@TextureReplacer:FOR[RSSVE]:NEEDS[TextureReplacer]
{
    %TextureMap
    {
        %GalaxyTex_NegativeX = RSSVE/Textures/SkyboxTextures/MilkyWay_NegativeX
        %GalaxyTex_NegativeY = RSSVE/Textures/SkyboxTextures/MilkyWay_NegativeY
        %GalaxyTex_NegativeZ = RSSVE/Textures/SkyboxTextures/MilkyWay_NegativeZ
        %GalaxyTex_PositiveX = RSSVE/Textures/SkyboxTextures/MilkyWay_PositiveX
        %GalaxyTex_PositiveY = RSSVE/Textures/SkyboxTextures/MilkyWay_PositiveY
        %GalaxyTex_PositiveZ = RSSVE/Textures/SkyboxTextures/MilkyWay_PositiveZ
    }
}
