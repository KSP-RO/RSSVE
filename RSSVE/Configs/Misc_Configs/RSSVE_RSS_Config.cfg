//  ================================================================================
//  Real Solar System patches:
//
//  • Fix the cloud and body textures clipping on low orbital altitudes.
//  ================================================================================

@REALSOLARSYSTEM:FOR[RSSVE]:NEEDS[RealSolarSystem]
{
    @ClipPlanes
    {
        @DX11
        {
            @cam00FarClip = 750000
        }

        @Other
        {
            @cam01FarClip = 750000
        }
    }
}
