//  ================================================================================
//  Real Solar System patches:
//
//  • Fix the cloud textures and Scatterer effects near clipping at low orbital
//    altitudes.
//  ================================================================================

@REALSOLARSYSTEM:FOR[RSSVE]:NEEDS[RealSolarSystem]
{
    @ClipPlanes
    {
        @DX11
        {
            @cam00FarClip = 3000000
        }

        @Other
        {
            @cam01FarClip = 3000000
        }
    }
}
