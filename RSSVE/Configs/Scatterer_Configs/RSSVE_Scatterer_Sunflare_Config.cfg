//  ================================================================================
//  Scale up the Scatterer sun flare to better match the RSS scaling.
//  ================================================================================

@Scatterer_sunflare:FOR[RSSVE]:NEEDS[Scatterer]
{
    @Sun
    {
        @flares
        {
            @Item,0
            {
                @scaleCurve
                {
                    @key,0 = 1 5.0 0.0 -0.2
                    @key,1 = 55 3.0 -0.007 -0.0012
                    @key,2 = 2500 1.2 0.0 0.0
                }

                @intensityCurve
                {
                    @key,0 = 2 0.0 0.0 0.0
                    @key,1 = 11 1.0 0.0 0.0
                }
            }

            @Item,1
            {
                @scaleCurve
                {
                    @key,0 = 1 5.0 0.0 -0.2
                    @key,1 = 55 1.0 -0.007 -0.0012
                    @key,2 = 2500 0.0 0.0 0.0
                }
            }
        }
    }
}
